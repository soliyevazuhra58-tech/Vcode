name: Build VCode Android Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 & Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Configure release keystore (optional GitHub Secret override)
        env:
          VCODE_KEYSTORE_BASE64: ${{ secrets.VCODE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$VCODE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$VCODE_KEYSTORE_BASE64" | base64 --decode > keystore/vcode-release.jks
            echo "Loaded custom release keystore from GitHub Secrets."
          else
            echo "Using repository signing keystore (keystore/vcode-release.jks)."
          fi

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          ./gradlew testReleaseUnitTest \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Build signed release APK
        env:
          VCODE_STORE_PASSWORD: ${{ secrets.VCODE_STORE_PASSWORD || 'vcode2026release' }}
          VCODE_KEY_ALIAS: ${{ secrets.VCODE_KEY_ALIAS || 'vcode_release' }}
          VCODE_KEY_PASSWORD: ${{ secrets.VCODE_KEY_PASSWORD || 'vcode2026release' }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Verify APK signature & prepare release filename
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH"
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp "$APK_PATH" "app/build/outputs/apk/release/VCode-v${VERSION_NAME}-release.apk"
          ls -lh app/build/outputs/apk/release/

      - name: Upload Release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vcode-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/VCode-v*-release.apk
          retention-days: 30

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcode-unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/VCode-v*-release.apk
          generate_release_notes: true
